name: Build
on: push
env:
  # Pinned Windows toolchain. Must match the local developer machine so the
  # produced .lib files use exactly the same MSVC STL / CRT.
  # To bump: take the "Fixed-version bootstrapper" vs_BuildTools.exe URL for the
  # wanted VS release from
  # https://learn.microsoft.com/visualstudio/releases/2026/release-history
  # and update all versions below together.
  VS_VERSION: "18.11.3"                # VS 2026 18.11.3 (build 18.11.12328.437)
  VS_BUILDTOOLS_URL: "https://download.visualstudio.microsoft.com/download/pr/5f474104-723f-4007-bf4c-92e42a23dcc6/ea54b67bfac576b6dd097f84eeaf6893780d2a613f90448ff038e8a2777a0afb/vs_BuildTools.exe"
  VS_INSTALL_PATH: "C:/BuildTools"
  MSVC_VERSION: "14.51.36231"          # VC/Tools/MSVC/<this>, _MSVC_STL_UPDATE 202604
  WINSDK_VERSION: "10.0.28000.0"
  LLVM_VERSION: "23.1.4"               # MSVC STL 14.51 requires clang >= 20
  LLVM_PATH: "C:/LLVM-pinned"
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-20.04]
        mode: [Release, Debug]
        arch: [x64, x86, arm64]
        exclude:
          - os: macos-latest
            arch: x86
          - os: windows-latest
            arch: arm64
          - os: ubuntu-20.04
            arch: arm64
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      shell: bash
      run: |
        if [[ "${{ runner.os }}" == "Windows" ]] ; then
          choco install zip
        elif [[ "${{ runner.os }}" == "macOS" ]] ; then
          brew install coreutils
        else
          sudo apt-get update -qq
          sudo apt-get install -y \
            git g++ g++-multilib clang-12 pandoc dpkg-dev \
            libcurl4-openssl-dev libgif-dev libjpeg-dev \
            libz-dev libpng-dev libtinyxml-dev libpixman-1-dev \
            libx11-dev libxcursor-dev ninja-build zip unzip \
            libfontconfig-dev libgl1-mesa-dev
        fi
    - name: Download depot_tools
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      run: |
        git clone 'https://chromium.googlesource.com/chromium/tools/depot_tools.git'
        echo "::add-path::${PWD}/depot_tools"
    - name: Sync Deps
      env:
        GIT_SYNC_DEPS_SKIP_EMSDK: true
      run: python3 tools/git-sync-deps
    - name: Fetch Ninja
      run: python3 bin/fetch-ninja
    - name: Install pinned MSVC (VS Build Tools)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $sdkBuild = $env:WINSDK_VERSION.Split('.')[2]
        $bt = Join-Path $env:RUNNER_TEMP 'vs_BuildTools.exe'
        Invoke-WebRequest $env:VS_BUILDTOOLS_URL -OutFile $bt
        $p = Start-Process $bt -Wait -PassThru -ArgumentList @(
          '--quiet', '--wait', '--norestart', '--nocache',
          '--installPath', $env:VS_INSTALL_PATH,
          '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
          '--add', "Microsoft.VisualStudio.Component.Windows11SDK.$sdkBuild")
        if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "vs_BuildTools failed: $($p.ExitCode)" }
        $vc = "$env:VS_INSTALL_PATH/VC/Tools/MSVC/$env:MSVC_VERSION"
        if (!(Test-Path "$vc/include/yvals_core.h")) {
          Get-ChildItem "$env:VS_INSTALL_PATH/VC/Tools/MSVC" -ErrorAction SilentlyContinue
          throw "MSVC $env:MSVC_VERSION not found in $env:VS_INSTALL_PATH"
        }
        if (!(Test-Path "C:/Program Files (x86)/Windows Kits/10/Include/$env:WINSDK_VERSION/ucrt")) {
          throw "Windows SDK $env:WINSDK_VERSION not found"
        }
        Select-String -Path "$vc/include/yvals_core.h" -Pattern '_MSVC_STL_(VERSION|UPDATE) '
        # clang-cl autodetects the STL from this variable; keep it on the pinned one too.
        "VCToolsInstallDir=$vc/" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
    - name: Install pinned LLVM
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Official release archive; extracted next to (not over) the runner's own LLVM.
        $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
        $archive = Join-Path $env:RUNNER_TEMP "$name.tar.xz"
        Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz" -OutFile $archive
        New-Item -ItemType Directory -Force $env:LLVM_PATH | Out-Null
        tar -xf $archive -C $env:LLVM_PATH --strip-components=1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $v = & "$env:LLVM_PATH/bin/clang-cl.exe" --version | Select-Object -First 1
        Write-Host $v
        if ($v -notmatch [regex]::Escape("clang version $env:LLVM_VERSION")) { throw "Unexpected clang: $v" }
    - name: Generating Ninja Files
      shell: bash
      run: |
        if [[ "${{ matrix.mode }}" == "Debug" ]] ; then
          export is_debug=true
          export is_official=false
        else
          export is_debug=false
          export is_official=true
        fi
        if [[ "${{ runner.os }}" == "Windows" ]] ; then
          "$LLVM_PATH/bin/clang-cl.exe" --version
          export gn_flags="is_trivial_abi=false win_vc=\"$VS_INSTALL_PATH/VC\" win_toolchain_version=\"$MSVC_VERSION\" win_sdk=\"C:/Program Files (x86)/Windows Kits/10\" win_sdk_version=\"$WINSDK_VERSION\" cc=\"clang\" cxx=\"clang++\" clang_win=\"$LLVM_PATH\" clang_win_version=\"${LLVM_VERSION%%.*}\""
          if [[ "${{ matrix.mode }}" == "Debug" ]] ; then
            export gn_flags="$gn_flags extra_cflags=[\"-MTd\"]"
          else
            export gn_flags="$gn_flags extra_cflags=[\"-MT\"]"
          fi
        elif [[ "${{ runner.os }}" == "macOS" ]] ; then
          if [[ "${{ matrix.arch }}" == arm64 ]] ; then
            export gn_flags='extra_cflags=["-stdlib=libc++", "-mmacosx-version-min=11.0"] extra_cflags_cc=["-frtti"]'
          else
            export gn_flags='extra_cflags=["-stdlib=libc++", "-mmacosx-version-min=10.9"] extra_cflags_cc=["-frtti"]'
          fi
        else
          export gn_flags='cc="clang-12" cxx="clang++-12"'
        fi
        gn gen out/${{ matrix.mode }}-${{ matrix.arch }} --args="is_debug=$is_debug is_official_build=$is_official skia_use_system_expat=false skia_use_system_icu=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_freetype=true skia_use_harfbuzz=true skia_pdf_subset_harfbuzz=true skia_use_system_freetype2=false skia_use_system_harfbuzz=false target_cpu=\"${{ matrix.arch }}\" $gn_flags"
    - name: Compiling
      run: ninja -C out/${{ matrix.mode }}-${{ matrix.arch }} skia modules
    - name: Copying Files
      shell: bash
      run: |
        if [[ "${{ runner.os }}" == "Windows" ]] ; then
          export libext=lib
        else
          export libext=a
        fi
        if [[ "${{ runner.os }}" == "macOS" ]] ; then
          export cp=gcp
        else
          export cp=cp
        fi
        export dst=Skia-${{ runner.os }}-${{ matrix.mode }}-${{ matrix.arch }}
        mkdir $dst
        $cp -R --parents \
          out/${{ matrix.mode }}-${{ matrix.arch }}/args.gn \
          out/${{ matrix.mode }}-${{ matrix.arch }}/*.$libext \
          LICENSE \
          include \
          modules/skcms/*.h \
          modules/skcms/src/*.h \
          modules/skottie/include/*.h \
          modules/skparagraph/include/*.h \
          modules/skplaintexteditor/include/*.h \
          modules/skresources/include/*.h \
          modules/sksg/include/*.h \
          modules/skshaper/include/*.h \
          modules/skunicode/include/*.h \
          modules/svg/include/*.h \
          src/base/*.h \
          src/codec/*.h \
          src/core/*.h \
          src/effects/*.h \
          src/effects/colorfilters/*.h \
          src/encode/*.h \
          src/gpu/*.h \
          src/gpu/ganesh/*.h \
          src/gpu/ganesh/d3d/*.h \
          src/gpu/ganesh/effects/*.h \
          src/gpu/ganesh/geometry/*.h \
          src/gpu/ganesh/gl/*.h \
          src/gpu/ganesh/gl/builders/*.h \
          src/gpu/ganesh/glsl/*.h \
          src/gpu/ganesh/gradients/*.h \
          src/gpu/ganesh/image/*.h \
          src/gpu/ganesh/mock/*.h \
          src/gpu/ganesh/mtl/*.h \
          src/gpu/ganesh/ops/*.h \
          src/gpu/ganesh/surface/*.h \
          src/gpu/ganesh/tessellate/*.h \
          src/gpu/ganesh/text/*.h \
          src/gpu/ganesh/vk/*.h \
          src/gpu/graphite/*.h \
          src/gpu/graphite/compute/*.h \
          src/gpu/graphite/dawn/*.h \
          src/gpu/graphite/geom/*.h \
          src/gpu/graphite/mtl/*.h \
          src/gpu/graphite/render/*.h \
          src/gpu/graphite/text/*.h \
          src/gpu/graphite/vk/*.h \
          src/gpu/mtl/*.h \
          src/gpu/tessellate/*.h \
          src/gpu/vk/*.h \
          src/gpu/vk/vulkanmemoryallocator/*.h \
          src/image/*.h \
          src/lazy/*.h \
          src/opts/*.h \
          src/pathops/*.h \
          src/pdf/*.h \
          src/ports/*.h \
          src/sfnt/*.h \
          src/shaders/*.h \
          src/shaders/gradients/*.h \
          src/sksl/*.h \
          src/sksl/analysis/*.h \
          src/sksl/codegen/*.h \
          src/sksl/ir/*.h \
          src/sksl/lex/*.h \
          src/sksl/tracing/*.h \
          src/sksl/transform/*.h \
          src/svg/*.h \
          src/text/*.h \
          src/text/gpu/*.h \
          src/utils/*.h \
          src/utils/mac/*.h \
          src/utils/win/*.h \
          src/xml/*.h \
          src/xps/*.h \
          third_party/externals/angle2/LICENSE \
          third_party/externals/angle2/include \
          third_party/externals/freetype/LICENSE.TXT \
          third_party/externals/freetype/docs/FTL.TXT \
          third_party/externals/freetype/docs/GPLv2.TXT \
          third_party/externals/freetype/include \
          third_party/externals/harfbuzz/COPYING \
          third_party/externals/harfbuzz/src/*.h \
          third_party/externals/icu/LICENSE \
          third_party/externals/icu/flutter/icudtl.dat \
          third_party/externals/libjpeg-turbo/LICENSE.md \
          third_party/externals/libjpeg-turbo/jconfig.h \
          third_party/externals/libjpeg-turbo/jerror.h \
          third_party/externals/libjpeg-turbo/jmorecfg.h \
          third_party/externals/libjpeg-turbo/jpeglib.h \
          third_party/externals/libjpeg-turbo/turbojpeg.h \
          third_party/externals/libpng/*.h \
          third_party/externals/libpng/LICENSE \
          third_party/externals/libwebp/COPYING \
          third_party/externals/libwebp/PATENTS \
          third_party/externals/libwebp/src/dec/*.h \
          third_party/externals/libwebp/src/dsp/*.h \
          third_party/externals/libwebp/src/enc/*.h \
          third_party/externals/libwebp/src/mux/*.h \
          third_party/externals/libwebp/src/utils/*.h \
          third_party/externals/libwebp/src/webp/*.h \
          third_party/externals/swiftshader/LICENSE.txt \
          third_party/externals/swiftshader/include \
          third_party/externals/zlib/*.h \
          third_party/externals/zlib/LICENSE \
          $dst
    - name: Uploading Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Skia-${{ runner.os }}-${{ matrix.mode }}-${{ matrix.arch }}
        path: Skia-${{ runner.os }}-${{ matrix.mode }}-${{ matrix.arch }}
